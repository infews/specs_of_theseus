/tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect hidden hidden" data-id="PP_Start" transform="translate(156.51,68)"><rect x="-50.02" y="-24" width="100.03" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">PP_Start</text></g><g class="pele-node pele-shape-rect hidden" data-id="UE_Choose_Story" transform="translate(163.33,857)"><rect x="-84.25" y="-24" width="168.5" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">UE_Choose_Story</text></g><g class="pele-node pele-shape-rect hidden" data-id="Acc_Accept" transform="translate(306.77,68)"><rect x="-60.24" y="-24" width="120.48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Acc_Accept</text></g><g class="pele-node pele-shape-rect" data-id="PP_Prioritize_Ideas" transform="translate(128.62,273)"><rect x="-100.62" y="-33" width="201.23" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">🧑🏻‍🎨 🧑🏾‍⚖️ Prioritize</tspan><tspan x="0" y="16.1">Ideas</tspan></text></g><g class="pele-node pele-shape-rect" data-id="PP_Choose_Epic" transform="translate(128.62,403)"><rect x="-88.63" y="-24" width="177.26" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">🧑🏾‍⚖️ Choose Epic</text></g><g class="pele-node pele-shape-fr-rect tone-7" data-id="PP_Break_Down_Epic" transform="translate(198.04,533)"><rect x="-108.62" y="-33" width="217.25" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path d="M-100.62,-33V33M100.62,-33V33" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">🧑🏾‍⚖️ 🧑🏼‍💻 🧞 Break</tspan><tspan x="0" y="16.1">Down Epic</tspan></text></g><g class="pele-node pele-shape-fr-rect tone-7" data-id="PP_Prioritize_Stories" transform="translate(266.35,672)"><rect x="-118.84" y="-33" width="237.68" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path d="M-110.84,-33V33M110.84,-33V33" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">🧑🏾‍⚖️ 🧑🏼‍💻 🧞 Prioritize</tspan><tspan x="0" y="16.1">Stories</tspan></text></g></g></svg>