/text></g><g class="pele-node pele-shape-rect hidden" data-id="UE_Choose_Story" transform="translate(92.25,730)"><rect x="-84.25" y="-24" width="168.5" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">UE_Choose_Story</text></g><g class="pele-node pele-shape-rect hidden" data-id="Dev_Tag_Repo" transform="translate(306.07,68)"><rect x="-74.02" y="-24" width="148.05" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Dev_Tag_Repo</text></g><g class="pele-node pele-shape-rect hidden hidden" data-id="Acc_Stop" transform="translate(495.89,730)"><rect x="-52.24" y="-24" width="104.48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Acc_Stop</text></g><g class="pele-node pele-shape-fr-rect" data-id="Acc_Deploy" transform="translate(306.07,264)"><rect x="-60.18" y="-24" width="120.35" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path d="M-52.18,-24V24M52.18,-24V24" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">⚙ Deploy</text></g><g class="pele-node pele-shape-fr-rect" data-id="Acc_Accept" transform="translate(375.06,400)"><rect x="-109.97" y="-24" width="219.94" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path d="M-101.97,-24V24M101.97,-24V24" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">🧑🏾‍⚖️ Accept or Reject</text></g><g class="pele-node pele-shape-fr-rect" data-id="Acc_Release" transform="translate(432.8,536)"><rect x="-87.49" y="-24" width="174.98" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><path d="M-79.49,-24V24M79.49,-24V24" fill="none" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">🧑🏾‍⚖️ ⚙ Release</text></g></g></svg>