# Builds docs/ into the GitHub Pages site with Hugo and the Hextra theme (config in site/) and
# publishes it on every push to main that changes the docs or the site.
# The diagrams are committed SVGs (bin/build-diagrams), so CI doesn't render them.
name: Publish docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo
        run: |
          curl -sSLo "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - uses: actions/checkout@v7
        with:
          submodules: true   # the Hextra theme, site/themes/hextra
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: hugo --source site --gc --minify --panicOnWarning --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
