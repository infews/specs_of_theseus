# Builds docs/ into the GitHub Pages site. The docs stay plain Markdown that
# reads well on GitHub too: this site mounts them as its content, and the
# render hooks in layouts/_markup turn their .md links into site links.
#
#   hugo server --source site     # preview at http://localhost:1313/specs_of_theseus/
#   hugo --source site            # build into site/public

baseURL = "https://dwf.bigpencil.net/specs_of_theseus/"
title = "Specs of Theseus"
locale = "en-US"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "section"]

[params]
  description = "A way for a team of people and agents to build software together. The evals are what lasts; the code can be replaced, plank by plank."
  repo = "https://github.com/infews/specs_of_theseus"

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false

# Mounting replaces Hugo's default content and static folders.
[[module.mounts]]
  source = "../docs/index.md"
  target = "content/_index.md"
[[module.mounts]]
  source = "../docs"
  target = "content"
  files = ["! index.md", "! src/**", "! img/**", "! design/**", "! **/.DS_Store"]
[[module.mounts]]
  source = "../docs/img"
  target = "static/img"
  files = ["! **.png"]

