# Builds docs/ into the GitHub Pages site with the Hextra theme (themes/hextra).
# The docs stay plain Markdown with no front matter: titles and sidebar order
# come from the [[cascade]] blocks below, and the render hooks in layouts/_markup
# turn .md links into site links and put the diagrams' SVGs into the page.
#
#   hugo server --source site

baseURL = "https://dwf.bigpencil.net/specs_of_theseus/"
title = "Specs of Theseus"
locale = "en-US"
theme = "hextra"
disableKinds = ["taxonomy", "term", "rss", "sitemap"]
enableInlineShortcodes = false

[params]
  description = "A way for a team of people and agents to build software together. The evals are what lasts; the code can be replaced, plank by plank."
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.theme]
    default = "system"
    displayToggle = true
  [params.page]
    width = "normal"
  [params.footer]
    displayPoweredBy = false
  [params.editURL]
    enable = true
    base = "https://github.com/infews/specs_of_theseus/edit/main/docs"
  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"

[markup.highlight]
  noClasses = false

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 1
[[menus.main]]
  name = "Search"
  weight = 2
  [menus.main.params]
    type = "search"
[[menus.main]]
  name = "GitHub"
  url = "https://github.com/infews/specs_of_theseus"
  weight = 3
  [menus.main.params]
    icon = "github"

