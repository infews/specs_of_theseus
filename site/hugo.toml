# Mounting replaces Hugo's default content, static and assets folders.
[[module.mounts]]
  source = "../docs/index.md"
  target = "content/_index.md"
[[module.mounts]]
  source = "../docs"
  target = "content"
  files = ["! index.md", "! src/**", "! img/**", "! design/**", "! **/.DS_Store"]
[[module.mounts]]
  source = "../docs/img"
  target = "static/img"
  files = ["! **.png"]
[[module.mounts]]
  source = "../docs/img"
  target = "assets/img"
  files = ["**.svg"]
[[module.mounts]]
  source = "assets"
  target = "assets"
# The favicons (the Noto Color Emoji sailboat) and web manifest, replacing Hextra's.
[[module.mounts]]
  source = "static"
  target = "static"

# Every page is a docs page, so it gets the sidebar.
[[cascade]]
  type = "docs"
  [cascade.target]
    path = "{/,/**}"

